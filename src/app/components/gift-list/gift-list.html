@if (gifts().length > 0) {
  <ul class="gift-grid" role="list">
    @for (gift of gifts(); track gift.id) {
      <li>
        <app-gift-item
          [gift]="gift"
          [editMode]="editMode()"
          [guestSessionId]="guestSessionId()"
          (remove)="remove.emit($event)"
        />
      </li>
    }
  </ul>
} @else {
  <div class="empty-state">
    <span class="empty-icon">🎁</span>
    <p class="empty-title">Kingisoove ei ole</p>
    @if (canAdd()) {
      <p class="empty-sub">Lisa oma esimene kingisoov üleval, et alustada.</p>
    } @else {
      <p class="empty-sub">Kingituste nimekiri on tühi.</p>
    }
  </div>
}
