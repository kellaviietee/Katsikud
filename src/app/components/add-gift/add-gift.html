<form class="add-gift-form" (ngSubmit)="submit()">
  <div class="form-fields">
    <input
      type="text"
      [(ngModel)]="name"
      name="name"
      placeholder="Kingituse nimi"
      class="input"
      autocomplete="off"
    />
    <div class="url-fields">
      @for (url of urls; track $index) {
        <div class="url-field-row">
          <input
            type="url"
            [(ngModel)]="urls[$index]"
            [name]="'url-' + $index"
            placeholder="Link näitele (valikuline)"
            class="input"
            autocomplete="off"
          />
          @if (urls.length > 1) {
            <button
              type="button"
              class="btn-remove-url"
              (click)="removeUrlField($index)"
              aria-label="Remove URL"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          }
        </div>
      }
      <button type="button" class="btn-add-url" (click)="addUrlField()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Lisa veel üks link
      </button>
    </div>
  </div>
  <button type="submit" class="btn-add" [disabled]="!name.trim()">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Lisa kingitus
  </button>
</form>
